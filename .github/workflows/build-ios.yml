name: Build Archivo iOS (.ipa & .app)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target to compile'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - device_ipa
          - simulator_app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Archivo iOS with Xcode 16 on macOS
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "=== Versiones de Xcode disponibles en el runner ==="
          ls -d /Applications/Xcode* || true
          
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          
          echo "=== Versión de Xcode activa ==="
          xcodebuild -version

      - name: Install XcodeGen & Generate Xcode Project
        run: |
          if ! command -v xcodegen &> /dev/null; then
            echo "Instalando XcodeGen mediante Homebrew..."
            brew install xcodegen
          fi
          echo "Versión de XcodeGen: $(xcodegen --version)"
          xcodegen generate
          echo "Contenido del directorio tras generar proyecto:"
          ls -la
          xcodebuild -list -project Archivo.xcodeproj

      # ----------------------------------------------------
      # 1. Compilación para iPhone Físico (.ipa)
      # ----------------------------------------------------
      - name: Build for Physical iOS Device
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'device_ipa' }}
        run: |
          echo "Compilando Archivo para arquitectura arm64 (iPhone físico)..."
          xcodebuild clean build \
            -project Archivo.xcodeproj \
            -scheme Archivo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data_device \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa for Physical iPhone
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'device_ipa' }}
        run: |
          echo "Creando estructura Payload para .ipa..."
          rm -rf Payload Archivo.ipa
          mkdir -p Payload
          cp -R derived_data_device/Build/Products/Release-iphoneos/Archivo.app Payload/
          cp Archivo/Resources/Info.plist Payload/Archivo.app/Info.plist || true
          plutil -replace UILaunchStoryboardName -string "LaunchScreen" Payload/Archivo.app/Info.plist || true
          plutil -replace UIRequiresFullScreen -bool YES Payload/Archivo.app/Info.plist || true
          zip -r Archivo.ipa Payload
          ls -lh Archivo.ipa

      # ----------------------------------------------------
      # 2. Compilación para Simulador iOS (.app.zip)
      # ----------------------------------------------------
      - name: Build for iOS Simulator
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'simulator_app' }}
        run: |
          echo "Compilando Archivo para simulador iPhone..."
          xcodebuild clean build \
            -project Archivo.xcodeproj \
            -scheme Archivo \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath derived_data_sim \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Simulator .app.zip
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'simulator_app' }}
        run: |
          cd derived_data_sim/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/Archivo-Simulator.app.zip" Archivo.app
          cd "$GITHUB_WORKSPACE"
          ls -lh Archivo-Simulator.app.zip

      # ----------------------------------------------------
      # 3. Subir artefactos a GitHub Actions
      # ----------------------------------------------------
      - name: Upload .ipa (Physical iPhone)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'device_ipa' }}
        uses: actions/upload-artifact@v4
        with:
          name: Archivo-iOS-Device-ipa
          path: Archivo.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Simulator App
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'simulator_app' }}
        uses: actions/upload-artifact@v4
        with:
          name: Archivo-iOS-Simulator-app
          path: Archivo-Simulator.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Generate Job Summary
        run: |
          echo "## 🚀 Compilación de Archivo iOS Completada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artefactos Generados:" >> $GITHUB_STEP_SUMMARY
          if [ -f Archivo.ipa ]; then
            echo "- **Archivo-iOS-Device-ipa** (\`Archivo.ipa\`): Listo para instalar en iPhone físico con Sideloadly, AltStore o TrollStore." >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f Archivo-Simulator.app.zip ]; then
            echo "- **Archivo-iOS-Simulator-app** (\`Archivo-Simulator.app.zip\`): Listo para arrastrar y soltar en el Simulador de iOS en Mac." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 Cómo instalar el .ipa en tu iPhone desde Windows:" >> $GITHUB_STEP_SUMMARY
          echo "1. Abre **Sideloadly** en Windows con tu iPhone conectado por USB." >> $GITHUB_STEP_SUMMARY
          echo "2. Arrastra el archivo \`Archivo.ipa\` a Sideloadly." >> $GITHUB_STEP_SUMMARY
          echo "3. Ingresa tu Apple ID y presiona **Start**." >> $GITHUB_STEP_SUMMARY
          echo "4. En tu iPhone, ve a *Ajustes > General > VPN y gestión de dispositivos* y confía en tu Apple ID." >> $GITHUB_STEP_SUMMARY
