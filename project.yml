name: Archivo
options:
  bundleIdPrefix: com.societext
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.12.0"
    CURRENT_PROJECT_VERSION: "24"
    DEVELOPMENT_TEAM: ""
targets:
  Archivo:
    type: application
    platform: iOS
    sources:
      - path: Archivo
    resources:
      - path: Archivo/Resources
    info:
      path: Archivo/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.societext.archivo
        PRODUCT_NAME: Archivo
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Archivo/Resources/Info.plist
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    scheme:
      testTargets:
        - ArchivoTests
  ArchivoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArchivoTests
    dependencies:
      - target: Archivo

